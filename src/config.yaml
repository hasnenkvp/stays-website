site:
  name: 'Stays'
  site: 'https://staysapp.fr'
  base: '/'
  trailingSlash: true

# Métadonnées par défaut (SEO)
metadata:
  title:
    default: Stays — Gardez la mémoire de chaque séjour
    template: '%s — Stays'
  description: 'Stays réunit vos hôtels, vos dates, vos lieux et vos souvenirs dans une application privée, élégante et pensée pour iPhone.'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: Stays
    images:
      - url: '/stays-logo.png'
        width: 512
        height: 512
    type: website
  twitter:
    cardType: summary

i18n:
  language: fr
  textDirection: ltr

# Le site n'a pas de blog.
apps:
  blog:
    isEnabled: false

# Thème : suit le réglage clair/sombre du système, sauf choix explicite du visiteur.
ui:
  theme: 'system'
