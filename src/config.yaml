site:
  name: 'Stays'
  site: 'https://staysapp.fr'
  base: '/'
  trailingSlash: true

# Métadonnées par défaut (SEO)
metadata:
  title:
    default: Stays — Carnet de séjours hôteliers pour iPhone
    template: '%s — Stays'
  description: 'Stays réunit votre historique hôtelier sur iPhone : vos hôtels sur un globe, un passeport de voyage chiffré (nuits, pays, villes, chaînes) et le partage entre amis.'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: Stays
    images:
      - url: '/og-image.png'
        width: 1200
        height: 630
    type: website
  twitter:
    cardType: summary_large_image

i18n:
  language: fr
  textDirection: ltr

# Le site n'a pas de blog.
apps:
  blog:
    isEnabled: false

# Thème : suit le réglage du système en CSS (prefers-color-scheme), sans bouton ni script.
ui:
  theme: 'system'
