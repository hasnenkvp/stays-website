site:
  name: 'Stays'
  site: 'https://staysapp.fr'
  base: '/'
  trailingSlash: true

# Default SEO metadata
metadata:
  title:
    default: Stays — Gardez la mémoire de chaque séjour
    template: '%s — Stays'
  description: 'Stays réunit vos hôtels, vos dates, vos lieux et vos souvenirs dans une application privée, élégante et pensée pour iPhone.'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: Stays
    images:
      - url: '/stays-logo.png'
        width: 512
        height: 512
    type: website
  twitter:
    cardType: summary

i18n:
  language: fr
  textDirection: ltr

apps:
  blog:
    isEnabled: false
    postsPerPage: 8

    post:
      isEnabled: true
      permalink: '/%slug%' # Variables: %slug%, %year%, %month%, %day%, %hour%, %minute%, %second%, %category%
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'blog' # Blog main path, you can change this to "articles" (/articles)
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'category' # Category main path /category/some-category, you can change this to "group" (/group/some-category)
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'tag' # Tag main path /tag/some-tag, you can change this to "topics" (/topics/some-category)
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: null # or "G-XXXXXXXXXX"

ui:
  theme: 'system' # Values: "system" | "light" | "dark" | "light:only" | "dark:only"
